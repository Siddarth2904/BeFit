server:
  port: 8082

# MongoDB Connection Settings
spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/
      database: fitnessactivity

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Eureka Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

# RabbitMQ Custom Properties
rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.traking